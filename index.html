<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/webp" href="/src/assets/logo.webp" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BenDjo | Infusions naturelles, petit-déjeuner &amp; traiteur</title>
    <meta
      name="description"
      content="BenDjo, infusions 100% naturelles, petit-déjeuner d'entreprise et service traiteur au Bénin."
    />

    <!-- Fraunces (serif display) + Work Sans (corps) via Google Fonts -->
    <!-- Telma (script élégant) via Fontshare, pour les mots d'accent -->
    <!-- Chargement asynchrone : les polices ne bloquent plus l'affichage de la page -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://api.fontshare.com" />
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;1,9..144,500&family=Work+Sans:wght@400;500;600&display=swap"
      data-swap-to-stylesheet
    />
    <link
      rel="preload"
      as="style"
      href="https://api.fontshare.com/v2/css?f[]=telma@400,500&display=swap"
      data-swap-to-stylesheet
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;1,9..144,500&family=Work+Sans:wght@400;500;600&display=swap"
      />
      <link rel="stylesheet" href="https://api.fontshare.com/v2/css?f[]=telma@400,500&display=swap" />
    </noscript>

    <!-- Open Graph / réseaux sociaux -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="%VITE_SITE_URL%/" />
    <meta property="og:title" content="BenDjo | Infusions naturelles, petit-déjeuner & traiteur" />
    <meta
      property="og:description"
      content="Infusions 100% naturelles, petit-déjeuner d'entreprise et service traiteur au Bénin."
    />
    <meta property="og:image" content="%VITE_SITE_URL%/og-image.jpg" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- SEO de base -->
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="%VITE_SITE_URL%/" />

    <!-- Données structurées (SEO local) -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "LocalBusiness",
        "name": "BenDjo",
        "description": "Infusions naturelles 100% béninoises, petit-déjeuner en entreprise et service traiteur.",
        "image": "%VITE_SITE_URL%/og-image.jpg",
        "url": "%VITE_SITE_URL%/",
        "telephone": "+229 01 62 01 41 61",
        "email": "bendjobenin@gmail.com",
        "priceRange": "1500 FCFA",
        "address": {
          "@type": "PostalAddress",
          "addressLocality": "Cotonou",
          "addressCountry": "BJ"
        },
        "sameAs": [
          "https://www.facebook.com/BenDjoBenin",
          "https://www.linkedin.com/company/bendjo/",
          "https://www.tiktok.com/@bendjo229"
        ]
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
